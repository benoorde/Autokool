services:
  web:
    build: ./docker/php
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: autokool
      DB_USER: autokool
      DB_PASS: autokool
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: autokool
      MYSQL_USER: autokool
      MYSQL_PASSWORD: autokool
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - dbdata:/var/lib/mysql
    ports:
      - "3307:3306"
volumes:
  dbdata:
