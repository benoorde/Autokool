services:
  web:
    build: ./docker/php
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: autokool
      DB_USER: autokool
      DB_PASS: autokool
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: autokool
      MYSQL_USER: autokool
      MYSQL_PASSWORD: autokool
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - dbdata:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
  phpmyadmin:
    image: phpmyadmin:5.2
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: autokool
      PMA_PASSWORD: autokool
    depends_on:
      db:
        condition: service_healthy
volumes:
  dbdata:
